services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "4321:4321"
    environment:
      PUBLIC_SUPABASE_URL: ${PUBLIC_SUPABASE_URL:-}
      PUBLIC_SUPABASE_ANON_KEY: ${PUBLIC_SUPABASE_ANON_KEY:-}
    volumes:
      - .:/app
      - /app/node_modules
    command: pnpm dev
