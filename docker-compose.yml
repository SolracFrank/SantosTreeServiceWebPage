services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev

    init: true

    ports:
      - "4321:4321"

    environment:
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-}
      PUBLIC_SUPABASE_URL: ${PUBLIC_SUPABASE_URL:-}
      PUBLIC_SUPABASE_ANON_KEY: ${PUBLIC_SUPABASE_ANON_KEY:-}
      PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${PUBLIC_SUPABASE_PUBLISHABLE_KEY:-}
      PUBLIC_CLOUDFLARE_TURNSTILE_SITE_KEY: ${PUBLIC_CLOUDFLARE_TURNSTILE_SITE_KEY:-}
      PUBLIC_CLOUDFARE_TURNSTILE_SITE_KEY: ${PUBLIC_CLOUDFARE_TURNSTILE_SITE_KEY:-}
      PUBLIC_CLOUDFLARE_TURNSTILE_KEY: ${PUBLIC_CLOUDFLARE_TURNSTILE_KEY:-}
      PUBLIC_CLOUDFARE_TURNSTILE_KEY: ${PUBLIC_CLOUDFARE_TURNSTILE_KEY:-}

    volumes:
      - .:/app
      - web_node_modules:/app/node_modules
      - pnpm_store:/pnpm/store

    develop:
      watch:
        - action: sync
          path: .
          target: /app
          ignore:
            - node_modules/
            - dist/
            - .astro/
            - .git/
        - action: rebuild
          path: package.json
        - action: rebuild
          path: pnpm-lock.yaml

volumes:
  web_node_modules:
  pnpm_store:
